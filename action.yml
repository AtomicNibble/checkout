name: 'Checkout'
description: 'Checkout a Git repo using --reference'
inputs:
  repository:
    description: |
      GitHub repository name (e.g., owner/repo) or direct Git repository URL (e.g., https://git.example.com/repo.git)
      Default: GITHUB_REPOSITORY
  token:
    description: |
      A token to fetch the repository.
      Typically, you would use GITHUB_TOKEN
  common-path:
    description: |
      Common (reference) git repo path under GITHUB_WORKSPACE
      Default: ${repository}.git
  path:
    description: 'Relative path under GITHUB_WORKSPACE to place the repository'
  ref:
    description: |
      A branch, tag or SHA to checkout
      Default: github.ref_name
  clean:
    description: 'Whether to clean working directory or not'
    default: true
  sparse-checkout:
    description: |
      Space-separated list of paths to restrict the working tree to. In cone
      mode (default) these are directories; top-level files are always
      included, so an empty list yields a top-level-files-only checkout. In
      non-cone mode these are gitignore-style patterns.
  sparse-checkout-cone-mode:
    description: |
      Use cone-mode sparse-checkout (faster on large repos, directories only).
      'true' (default) or 'false' for non-cone pattern matching. Setting either
      this or sparse-checkout enables sparse-checkout; leave both empty for a
      full checkout.
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        REPO=${{ inputs.repository }}
        REF_DIR=${{ inputs.common-path }}
        TARGET_DIR=${{ inputs.path }}
        TARGET_REF=${{ inputs.ref }}
        CLEAN=${{ inputs.clean }}
        SPARSE='${{ inputs.sparse-checkout }}'
        SPARSE_CONE='${{ inputs.sparse-checkout-cone-mode }}'

        GITHUB_REF=${{ github.ref_name }}
        GITHUB_ACTION_PATH='${{ github.action_path }}'

        REPO=${REPO:-$GITHUB_REPOSITORY}
        [ "$TARGET_DIR" ] && TARGET_REF=${TARGET_REF:-$GITHUB_REF}
        [ ! "$TARGET_DIR" ] && CLEAN=

        if [[ "$REPO" == https://* ]]; then
          REPO_URL="$REPO"
          SAFE_REPO_NAME="${REPO#*://}"
        else
          REPO_URL="https://github.com/$REPO"
          SAFE_REPO_NAME="$REPO"
        fi

        REF_DIR=${REF_DIR:-$SAFE_REPO_NAME.git}

        try_remove_locks() {
          local dir="$1"
          if [ -d "$dir" ]; then
            rm -f "$dir/index.lock" "$dir/HEAD.lock" "$dir/config.lock" || true
          fi
        }

        try_remove_locks "$REF_DIR"
        [ "$TARGET_DIR" ] && try_remove_locks "$TARGET_DIR/.git"

        CMD="bash '$GITHUB_ACTION_PATH'/git-checkout.sh --debug --repo '$REPO_URL' --ref-dir '$REF_DIR'"
        [ "$TARGET_DIR" ] && CMD="$CMD --target-dir '$TARGET_DIR'"
        [ "$TARGET_REF" ] && CMD="$CMD --target-ref '$TARGET_REF'"
        [ "$CLEAN" == "true" ] && CMD="$CMD --clean"
        if [ "$SPARSE" ] || [ "$SPARSE_CONE" ]; then
          CMD="$CMD --sparse-enable"
          [ "$SPARSE_CONE" ] && CMD="$CMD --sparse-cone '$SPARSE_CONE'"
          [ "$SPARSE" ] && CMD="$CMD --sparse '$SPARSE'"
        fi
        echo $CMD

        eval $CMD
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
